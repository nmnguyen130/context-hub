x-shared-env: &shared-env
  POSTGRES_HOST: db
  REDIS_HOST: redis
  PYTHONPATH: /workspace

services:
  db:
    image: pgvector/pgvector:pg18
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432" # Bind to localhost for security during development
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-contexthub}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "127.0.0.1:6379:6379" # Bind to localhost for security during development
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      <<: *shared-env
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.worker.tasks.celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *shared-env
    volumes:
      - ./app:/workspace/app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
