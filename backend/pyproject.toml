[project]
name = "context-hub"
version = "0.1.0"
description = "ContextHub Backend - Production-Grade AI Knowledge Platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.138.1",
    "uvicorn>=0.49.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "pyjwt>=2.10.0",
    "bcrypt>=4.3.0",
    "redis>=5.3.0",
    "celery>=5.6.3",
    "pgvector>=0.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.26.0",
    "httpx>=0.28.0",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["D"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
